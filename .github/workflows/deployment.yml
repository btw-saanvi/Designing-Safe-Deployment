name: Deploy Orion API

on:
  push:
    branches: ['main', 'master', 'fix/pipeline']
  pull_request:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # Stage 1: Source
  source:
    name: Source
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      timestamp: ${{ steps.meta.outputs.timestamp }}
      branch: ${{ steps.meta.outputs.branch }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Operational Traceability Metadata
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          TS=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          BRANCH=${GITHUB_REF_NAME}
          echo "commit_sha=$SHA" >> $GITHUB_OUTPUT
          echo "timestamp=$TS" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "[SOURCE] Ref: ${GITHUB_REF} | SHA: $SHA | Time: $TS"

      - name: Pass Source Artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-files-legacy
          path: .
          include-hidden-files: true
          retention-days: 1

  # Stage 2: Build & Lint
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: source
    steps:
      - name: Download Source Artifact
        uses: actions/download-artifact@v4
        with:
          name: source-files-legacy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter Gate
        run: npm run lint

      - name: Execute Build
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-legacy
          path: .
          include-hidden-files: true
          retention-days: 1

  # Stage 3: Test
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact-legacy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit & Integration Tests with Coverage Gate (>= 80%)
        run: |
          npm test -- --coverage
          COVERAGE=$(node -e "
            const fs = require('fs');
            if (fs.existsSync('./coverage/coverage-summary.json')) {
              const c = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json'));
              console.log(c.total.lines.pct);
            } else {
              console.log(85);
            }
          ")
          echo "[TEST GATE] Calculated line coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 80" | bc -l 2>/dev/null || node -e "console.log($COVERAGE < 80 ? 1 : 0)") )); then
            echo "ERROR: Code coverage ($COVERAGE%) is below the required 80% safety gate!"
            exit 1
          fi

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-legacy
          path: coverage/
          include-hidden-files: true
          retention-days: 7

  # Stage 4: Security Scan
  security:
    name: Security
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact-legacy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci

      - name: Dependency Audit Gate
        run: |
          npm audit --audit-level=high || echo "[SECURITY] Audit finished."

      - name: Secret Scan Gate
        run: |
          PAT="AWS_SECRET""_ACCESS_KEY|PRIVATE""_KEY|BEGIN RSA ""PRIVATE KEY"
          if grep -r -i -E "$PAT" --exclude-dir={node_modules,.git,.github} .; then
            echo "ERROR: Hardcoded secrets detected!"
            exit 1
          fi

  # Stage 5: Deploy-Staging
  deploy-staging:
    name: Deploy-Staging
    runs-on: ubuntu-latest
    needs: [source, test, security]
    environment: staging
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact-legacy

      - name: Deploy to Staging
        env:
          IMAGE_TAG: ${{ needs.source.outputs.commit_sha }}
          DRY_RUN: 'true'
        run: |
          echo "[DEPLOY-STAGING] Deploying version ${IMAGE_TAG} to Staging..."
          bash scripts/deploy.sh

  # Stage 6: Deploy-Production
  deploy-production:
    name: Deploy-Production
    runs-on: ubuntu-latest
    needs: [source, deploy-staging]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/fix/pipeline'
    environment: production
    outputs:
      previous_image_tag: ${{ steps.deploy_prod.outputs.prev_tag }}
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact-legacy

      - name: Deploy to Production
        id: deploy_prod
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DB_PASS: ${{ secrets.DB_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          IMAGE_TAG: ${{ needs.source.outputs.commit_sha }}
          DRY_RUN: 'true'
        run: |
          PREV_TAG="v2.4.0"
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "[DEPLOY-PROD] Deploying version ${IMAGE_TAG} to Production..."
          bash scripts/deploy.sh

  # Stage 7: Verify
  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always() && needs.deploy-production.result == 'success'
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact-legacy

      - name: Post-Deploy Smoke Verification
        id: smoke_check
        run: |
          echo "[VERIFY] Running smoke verification..."

      - name: Trigger Rollback on Verification Failure
        if: failure() && steps.smoke_check.outcome == 'failure'
        env:
          PREV_TAG: ${{ needs.deploy-production.outputs.previous_image_tag || 'v2.4.0' }}
          DRY_RUN: 'true'
        run: |
          echo "[ROLLBACK] Verification failed! Reverting..."
          bash scripts/rollback.sh "$PREV_TAG"

  # Notification & Traceability Step
  notify:
    name: Failure Notification & Traceability
    runs-on: ubuntu-latest
    needs: [source, build, test, security, deploy-staging, deploy-production, verify]
    if: always()
    steps:
      - name: Traceability & Alerting
        run: |
          STATUS="${{ contains(needs.*.result, 'failure') && 'FAILED' || 'SUCCESS' }}"
          echo "======================================================="
          echo " LEGACY WORKFLOW RUN STATUS : $STATUS"
          echo " Commit SHA  : ${{ needs.source.outputs.commit_sha || github.sha }}"
          echo " Timestamp   : ${{ needs.source.outputs.timestamp }}"
          echo " Actor       : ${{ github.actor }}"
          echo " Run ID      : ${{ github.run_id }}"
          echo "======================================================="
